# Dynamo Control Plane deployment on BF-3 Grace CPU nodes
# Runs router, planner, KVBM, and connection manager on ARM64
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-control-plane
  namespace: dynamo-inference
  labels:
    app: dynamo
    component: control-plane
    hardware: bf3-grace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo
      component: control-plane
  template:
    metadata:
      labels:
        app: dynamo
        component: control-plane
        hardware: bf3-grace
    spec:
      # Schedule ONLY on BF-3 Grace CPU nodes
      nodeSelector:
        nvidia.com/dpu: "bf3"
        kubernetes.io/arch: "arm64"
      tolerations:
        - key: "nvidia.com/dpu"
          operator: "Equal"
          value: "bf3"
          effect: "NoSchedule"

      # Host networking for RDMA access
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      containers:
        # --- Dynamo Router ---
        - name: dynamo-router
          image: dynamo-cp:arm64
          command: ["dynamo-router"]
          args:
            - "--config=/etc/dynamo/dynamo-bf3-config.yaml"
            - "--bind=0.0.0.0:8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          volumeMounts:
            - name: dynamo-config
              mountPath: /etc/dynamo
            - name: nixl-config
              mountPath: /etc/nixl
            - name: hugepages
              mountPath: /dev/hugepages
          env:
            - name: DYN_DISCOVERY_BACKEND
              value: "kubernetes"
            - name: UCX_NET_DEVICES
              value: "mlx5_0:1"
            - name: UCX_TLS
              value: "rc_mlx5,cuda_copy"
            - name: LD_LIBRARY_PATH
              value: "/opt/nixl/lib:/opt/ucx/lib"

        # --- Dynamo Planner / Autoscaler ---
        - name: dynamo-planner
          image: dynamo-cp:arm64
          command: ["dynamo-planner"]
          args:
            - "--config=/etc/dynamo/dynamo-bf3-config.yaml"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: dynamo-config
              mountPath: /etc/dynamo

        # --- KVBM (KV Block Manager) ---
        - name: dynamo-kvbm
          image: dynamo-cp:arm64
          command: ["dynamo-kvbm"]
          args:
            - "--config=/etc/dynamo/dynamo-bf3-config.yaml"
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "8"
              memory: "64Gi"   # Grace LPDDR5X for KV cache spillover
          volumeMounts:
            - name: dynamo-config
              mountPath: /etc/dynamo
            - name: nixl-config
              mountPath: /etc/nixl
            - name: hugepages
              mountPath: /dev/hugepages
            - name: bf3-nvme
              mountPath: /mnt/bf3-nvme
          env:
            - name: UCX_NET_DEVICES
              value: "mlx5_0:1"
            - name: UCX_TLS
              value: "rc_mlx5,cuda_copy"

      volumes:
        - name: dynamo-config
          configMap:
            name: dynamo-bf3-config
        - name: nixl-config
          configMap:
            name: nixl-bf3-config
        - name: hugepages
          emptyDir:
            medium: HugePages
        - name: bf3-nvme
          hostPath:
            path: /mnt/bf3-nvme
            type: DirectoryOrCreate
---
# Service for control plane access
apiVersion: v1
kind: Service
metadata:
  name: dynamo-control-plane
  namespace: dynamo-inference
  labels:
    app: dynamo
    component: control-plane
spec:
  type: ClusterIP
  selector:
    app: dynamo
    component: control-plane
  ports:
    - name: frontend
      port: 8000
      targetPort: 8000
    - name: request-plane
      port: 9100
      targetPort: 9100
    - name: event-pub
      port: 9200
      targetPort: 9200
    - name: event-sub
      port: 9201
      targetPort: 9201
    - name: health
      port: 9300
      targetPort: 9300
    - name: metrics
      port: 9400
      targetPort: 9400
---
# ConfigMap: Dynamo config
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamo-bf3-config
  namespace: dynamo-inference
data:
  dynamo-bf3-config.yaml: |
    # Inline from grace-cpu-port/dynamo/dynamo-bf3-config.yaml
    # See that file for full configuration reference
    dynamo:
      cluster_name: "bf3-disagg-inference"
      frontend:
        host: "0.0.0.0"
        port: 8000
      router:
        type: "kv_aware"
        config:
          prefix_aware: true
          disaggregated: true
      discovery:
        backend: "kubernetes"
      request_plane:
        transport: "tcp"
        bind_address: "0.0.0.0"
        port: 9100
      event_plane:
        transport: "zmq"
        bind_address: "0.0.0.0"
        port: 9200
---
# ConfigMap: NIXL config
apiVersion: v1
kind: ConfigMap
metadata:
  name: nixl-bf3-config
  namespace: dynamo-inference
data:
  nixl-bf3-config.yaml: |
    nixl:
      agent:
        name: "bf3-nixl-agent"
      backends:
        - type: ucx
          priority: 1
          config:
            net_devices: "mlx5_0:1"
            tls: "rc_mlx5,cuda_copy"
