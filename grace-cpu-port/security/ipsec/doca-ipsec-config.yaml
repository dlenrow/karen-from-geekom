# DOCA IPsec Inline Configuration for BF-3 SH
# Encrypts ALL RDMA traffic at ConnectX-7 wire speed (400Gb/s).
# Hardware crypto offload — zero CPU overhead on ARM cores.
#
# This replaces cleartext RDMA with AES-256-GCM encrypted RDMA.
# Prompts, KV cache blocks, metadata — everything encrypted.

doca_ipsec:
  # ConnectX-7 device for crypto offload
  device: "mlx5_0"

  # Mode: full hardware offload (no software fallback)
  offload_mode: "full"

  # --- Crypto Parameters ---
  crypto:
    # AES-256-GCM — authenticated encryption
    cipher: "AES-256-GCM"
    # 128-bit ICV for authentication
    icv_length: 128
    # Extended Sequence Numbers for long-lived SAs
    esn: true
    # Anti-replay window (packets)
    anti_replay_window: 1024

  # --- IPsec Mode ---
  # Transport mode: encrypt payload, keep IP header
  # (Tunnel mode adds overhead, unnecessary for DC fabric)
  mode: "transport"
  protocol: "ESP"

  # --- Security Association Management ---
  sa_management:
    # IKEv2 for automated key exchange
    ike_version: 2

    # Identity: use DICE-derived key from BF-3 hardware
    # The IKE identity is the BF-3 DICE certificate
    identity_type: "certificate"
    identity_cert: "/etc/ipsec/bf3-dice-identity.pem"
    identity_key: "/etc/ipsec/bf3-dice-identity.key"

    # CA bundle: NVIDIA manufacturing CA + cluster CA
    ca_bundle: "/etc/ipsec/ca-bundle.pem"

    # SA lifetime
    sa_lifetime_seconds: 3600    # Rekey every hour
    sa_lifetime_bytes: 0         # No byte limit (time-based only)

    # DH group for key exchange
    dh_group: "MODP_3072"        # Or ECDH P-256 for lower overhead

    # PRF (Pseudo-Random Function)
    prf: "HMAC-SHA-256"

    # Integrity (for IKE, not ESP — ESP uses GCM's built-in auth)
    integrity: "HMAC-SHA-256-128"

  # --- Peer Configuration ---
  # Each peer BF-3 SH node gets an SA
  # Auto-discovered via SPIFFE or statically configured
  peers:
    discovery: "spiffe"  # or "static"

    # SPIFFE-based peer discovery:
    # When a new BF-3 node joins the cluster with a valid SPIFFE SVID,
    # IKEv2 SA is automatically negotiated using DICE certs
    spiffe:
      trust_domain: "inference.cluster.local"
      workload_api_socket: "/run/spire/sockets/agent.sock"
      # Only accept peers with these SPIFFE ID prefixes
      allowed_spiffe_ids:
        - "spiffe://inference.cluster.local/bf3/*"

    # Static peer config (alternative to SPIFFE discovery)
    # static:
    #   - peer_ip: "10.0.1.2"
    #     peer_cert: "/etc/ipsec/peers/node-2.pem"
    #   - peer_ip: "10.0.1.3"
    #     peer_cert: "/etc/ipsec/peers/node-3.pem"

  # --- Traffic Selectors ---
  # What traffic to encrypt
  traffic_selectors:
    # Encrypt ALL RDMA traffic (RoCE v2)
    - protocol: "UDP"
      dst_port: 4791     # RoCE v2 well-known port
      action: "encrypt"

    # Encrypt NIXL data transfers
    - protocol: "UDP"
      dst_port_range: "40000-41000"  # NIXL RDMA port range
      action: "encrypt"

    # Encrypt Dynamo control plane
    - protocol: "TCP"
      dst_port: 8001     # Request plane
      action: "encrypt"
    - protocol: "TCP"
      dst_port: 8002     # Event plane (ZMQ)
      action: "encrypt"

    # Encrypt etcd traffic (if standalone)
    - protocol: "TCP"
      dst_port: 2379
      action: "encrypt"

    # DROP unencrypted traffic from outside (default-deny)
    - protocol: "*"
      src: "!local"
      action: "drop"

  # --- Performance Tuning ---
  tuning:
    # ConnectX-7 hardware crypto ring size
    crypto_queue_depth: 512
    # Number of SAs to pre-allocate
    max_sa_count: 64
    # Batch size for SA operations
    sa_batch_size: 8
