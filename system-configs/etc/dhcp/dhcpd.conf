subnet 192.168.50.0 netmask 255.255.255.0 {
    range 192.168.50.100 192.168.50.200;
    option routers 192.168.50.1;
    option domain-name-servers 8.8.8.8, 8.8.4.4;
    option broadcast-address 192.168.50.255;
}

subnet 192.168.51.0 netmask 255.255.255.0 {
    range 192.168.51.100 192.168.51.200;
    option routers 192.168.51.1;
    option domain-name-servers 8.8.8.8, 8.8.4.4;
    option broadcast-address 192.168.51.255;
}

subnet 192.168.100.0 netmask 255.255.255.0 {
    range 192.168.100.100 192.168.100.200;  # Reserve 100 addresses for clients
    option routers 192.168.100.1;      # Gateway for VLAN clients
    option subnet-mask 255.255.255.0;
    option domain-name-servers 8.8.8.8, 8.8.4.4;  # Public DNS
}


