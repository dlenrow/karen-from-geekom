apiVersion: apps/v1
kind: Deployment
metadata:
  name: vlan1-forwarding
  labels:
    app: vlan1-fw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vlan1-fw
  template:
    metadata:
      labels:
        app: vlan1-fw
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "vlan1-network",
              "interfaceRequest": "net1"
            }
          ]
    spec:
      hostNetwork: true
      containers:
      - name: vlan1-forwarder
        image: ubuntu:20.04
        command: ["/bin/bash", "-c"]
        args:
          - |
            # Install required tools
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y \
              iproute2 iptables isc-dhcp-server iputils-ping tcpdump curl jq \
              && apt-get clean

            echo "Configuring VLAN 1 interface (net1) on enx0 trunk..."

            # Set up VLAN 1 interface (provided by Multus)
            ip addr add 192.168.50.1/24 dev net1
            ip link set net1 up

            echo "Fetching default gateway for cilium_host..."

            # Fetch the default gateway for cilium_host
            CILIUM_GATEWAY=$(ip route show default | grep cilium_host | awk '{print $3}')
            if [ -z "$CILIUM_GATEWAY" ]; then
              echo "Error: Could not determine default gateway for cilium_host"
              exit 1
            fi
            echo "Using cilium_host gateway: $CILIUM_GATEWAY"

            echo "Setting up policy-based routing for VLAN 1..."

            # Add routing table for VLAN 1
            echo "201 vlan1" >> /etc/iproute2/rt_tables
            ip rule add from 192.168.50.0/24 table vlan1
            ip route add 192.168.50.0/24 dev net1 table vlan1
            ip route add default via $CILIUM_GATEWAY table vlan1

            echo "Enabling IP forwarding..."
            sysctl -w net.ipv4.ip_forward=1

            echo "Setting up NAT and forwarding rules..."

            # NAT for VLAN 1 traffic via cilium_host
            iptables -A FORWARD -i net1 -o cilium_host -j ACCEPT
            iptables -A FORWARD -i cilium_host -o net1 -m state --state ESTABLISHED,RELATED -j ACCEPT
            iptables -t nat -A POSTROUTING -o cilium_host -s 192.168.50.0/24 -j MASQUERADE

            echo "Configuring DHCP server for VLAN 1..."

            # Configure DHCP server for VLAN 1
            echo "INTERFACESv4='net1'" > /etc/default/isc-dhcp-server
            cat <<EOF > /etc/dhcp/dhcpd.conf
            subnet 192.168.50.0 netmask 255.255.255.0 {
                range 192.168.50.100 192.168.50.200;
                option routers 192.168.50.1;
                option subnet-mask 255.255.255.0;
                option domain-name-servers 8.8.8.8, 8.8.4.4;
            }
            EOF

            # Create leases file
            touch /var/lib/dhcp/dhcpd.leases
            chown root:root /var/lib/dhcp/dhcpd.leases
            chmod 644 /var/lib/dhcp/dhcpd.leases

            # Start DHCP server
            service isc-dhcp-server start || (echo "DHCP server failed to start" && exit 1)

            echo "Configuration completed. Keeping container running..."
            tail -f /dev/null
        securityContext:
          privileged: true

