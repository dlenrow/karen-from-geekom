apiVersion: v1
kind: Pod
metadata:
  name: pod-with-vlan
  annotations:
    k8s.v1.cni.cncf.io/networks: vlan1-network
spec:
  containers:
  - name: busybox
    image: ubuntu:20.04
    command: ["/bin/bash", "-c"]
    args:
    - |
      apt update && apt install -y iproute2 iptables iputils-ping bridge-utils \
        ebtables tcpdump tshark && \
      tail -f /dev/null

